# Someone enabled the PQ hybrid group... but TLS 1.3 is off, so it can never be negotiated.
server {
    listen 443 ssl;
    server_name payments.example.com;
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_ecdh_curve X25519MLKEM768:secp384r1;
}
