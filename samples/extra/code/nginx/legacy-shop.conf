# Reverse proxy for the shop (TLS settings copied from a 2016 hardening guide)
http {
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:AES128-SHA:DES-CBC3-SHA';
    # ssl_ciphers 'RC4-SHA:EXP-RC4-MD5';   # old value, kept for reference (commented out)
    ssl_prefer_server_ciphers on;

    server {
        listen 443 ssl;
        server_name shop.example.com;
        ssl_certificate     /etc/nginx/tls/shop.crt;
        ssl_certificate_key /etc/nginx/tls/shop.key;
    }

    server {
        listen 443 ssl;
        server_name api.example.com;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;
        ssl_certificate     /etc/nginx/tls/api.crt;
        ssl_certificate_key /etc/nginx/tls/api.key;
    }
}
