# Apache httpd mod_ssl
SSLProtocol all -SSLv3
SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!aNULL
SSLOpenSSLConfCmd Curves X25519:secp384r1

<VirtualHost *:443>
    ServerName intranet.example.com
    SSLEngine on
    SSLProtocol -all +TLSv1.2
</VirtualHost>

<VirtualHost *:8443>
    ServerName pos.example.com
    SSLEngine on
    # "SSL" tag = cipher list for TLS <= 1.2; the TLSv1.3 line only sets AEAD suites
    SSLCipherSuite SSL ECDHE-RSA-AES128-GCM-SHA256:DES-CBC3-SHA
    SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384
</VirtualHost>
