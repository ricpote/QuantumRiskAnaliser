name: ci
on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-go@v5     # the live-probe tests start the TLS lab (needs Go >= 1.24)
        with: {go-version: "1.24"}
      - name: Install tshark (needed for pcap ingestion)
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark
      - run: pip install -e ".[dev]"
      - name: Ground-truth accuracy must stay at 100%
        env:
          QT_NOW: "2026-10-10T12:00:00Z"
        run: pytest -q
      - name: Ground-truth evaluation
        run: python -m quantumtrace.evaluate
      - name: CBOM must validate against the CycloneDX 1.6 schema
        run: |
          qtrace scan samples/official --out out
          qtrace validate out/cbom.cdx.json

  docker:                         # the jury only uses Docker: the image must build and work on every PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image from scratch
        run: docker build -t quantumtrace .
      - name: Scan + CBOM validation inside the container
        run: |
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/data" quantumtrace qtrace scan /data/samples/official --out /data/out
          docker run --rm -v "$PWD:/data" quantumtrace qtrace validate /data/out/cbom.cdx.json
      - name: Live probe against the bundled TLS lab (all 7 endpoints, modern + legacy halves)
        run: |
          docker run --rm quantumtrace sh -c "tlslab >/dev/null 2>&1 & sleep 2; qtrace probe 127.0.0.1:8443 127.0.0.1:8444 127.0.0.1:8445 127.0.0.1:8446 127.0.0.1:8447 127.0.0.1:2525 127.0.0.1:5433" | tee probe.txt
          test "$(grep -c 'handshakes' probe.txt)" -eq 7     # every endpoint answered
          test "$(grep -c 'PQ-protected' probe.txt)" -eq 4   # 8443 8446 8447 5433
          test "$(grep -c 'HNDL-exposed' probe.txt)" -eq 3   # 8444 8445 2525
          grep -q "✓ TLS 1.0" probe.txt && grep -q "3DES" probe.txt   # legacy half really serves obsolete crypto
      - name: Dashboard answers on :8501
        run: |
          docker run -d --name ui -p 8501:8501 quantumtrace
          python3 scripts/smoke_ui.py || { docker logs ui; exit 1; }
      - name: Dashboard logs
        if: always()
        run: docker logs ui || true
